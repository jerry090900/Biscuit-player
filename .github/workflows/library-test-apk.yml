name: Library UI Test APK

on:
  push:
    branches: [library-vlc-style]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/library-vlc-style'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain

      - name: Prepare Library ARM64 test download
        run: |
          test -f app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          mkdir -p output
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk output/Biscuit-Player-debug-arm64-v8a.apk
          printf 'Branch: %s\nCommit: %s\nPackage: app.biscuit.player.debug\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > output/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Biscuit-Player-library-debug-arm64-v8a
          path: output/
          if-no-files-found: error
