name: Build ARM64 Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew assembleDebug --console=plain

      - name: Prepare ARM64 test APK
        run: |
          test -f app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          mkdir -p output
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk output/Biscuit-Player-debug-arm64-v8a.apk

      - name: Upload ARM64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: Biscuit-Player-debug-arm64-v8a
          path: output/Biscuit-Player-debug-arm64-v8a.apk
          if-no-files-found: error
